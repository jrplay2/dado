
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D10 - Dado 3D Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom utility classes for 3D effects */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-preserve-3d {
      transform-style: preserve-3d;
    }

    /* Keyframes for the dice rolling animation */
    @keyframes roll-die {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(0.8);
      }
      50% {
        transform: rotateX(540deg) rotateY(720deg) rotateZ(180deg) scale(1.1);
      }
      100% {
        transform: rotateX(1080deg) rotateY(1080deg) rotateZ(360deg) scale(1);
      }
    }

    /* Class to apply the animation */
    .animate-roll {
      animation: roll-die 2s cubic-bezier(0.6, -0.28, 0.735, 0.045);
    }
  </style>
